<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title> multi-agent defaults harness</title>
  </head>
  <body>
    <h1> multi-agent defaults </h1>
    <pre id="status">running…</pre>
    <script type="module" src="/e2e/multi-agent-harness.js"></script>
    <script type="module">
      const status = document.getElementById('status');
      const poll = => {
        const result = window.__multiAgentE2eResult;
        if (result === undefined) {
          window.setTimeout(poll, 50);
          return;
        }
        status.textContent = JSON.stringify(result, null, 2);
      };
      poll;
    </script>
  </body>
</html>
