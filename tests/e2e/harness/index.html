<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title> embed config-url harness</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
      }
      agentable-canvas {
        display: block;
        width: 100%;
        height: 100%;
        min-height: 480px;
      }
    </style>
  </head>
  <body>
    <agentable-canvas
      id="canvas"
      tenant="harness"
      config-url="/fixtures/embed-config-static.json"
      data-skip-react-mount
    ></agentable-canvas>
    <script type="module" src="/embed/agentable-canvas.js"></script>
    <script type="module">
      window.__lastConfigReload = null;
      const el = document.getElementById('canvas');
      el.addEventListener('agentable:config-reloaded', (event) => {
        window.__lastConfigReload = event.detail;
      });
      window.__embedHarness = {
        async reload {
          await el.reload;
        },
      };
    </script>
  </body>
</html>
