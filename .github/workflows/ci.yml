name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

  typecheck:
    name: Typecheck (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

  quality-gates:
    # The REQUIRED gate. Runs the release suite (full suite minus the
    # shrink-only exclusion list in tests/release-exclusions.txt) so the
    # required signal states only true things while the full-suite debt is
    # burned down. The full-suite job below keeps the debt visible; when the
    # exclusion list reaches zero this job becomes `npm run test` again.
    name: Unit tests (release gate)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Unit tests (release gate)
        run: npm run test:release

  full-suite:
    # Advisory while tests/release-exclusions.txt shrinks to zero: shows the
    # remaining debt on every PR without blocking merges on known-red files.
    name: Full suite (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Full suite
        run: npm run test

  bundle-budgets:
    # Builds the embed bundles and enforces the gzip budgets in
    # scripts/check-bundle-size.mjs. Required: a budget bust blocks merge.
    name: Bundle budgets
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build embeds and check budgets
        # REQUIRE_ALL turns a missing artifact into a failure, so the gate
        # cannot pass by a bundle silently not being built.
        env:
          CHECK_BUNDLE_REQUIRE_ALL: "1"
        run: npm run build:embed:site && npm run check:bundle
