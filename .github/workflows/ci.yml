name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

  typecheck:
    # Required since Wave 4: `npm run typecheck` covers tsconfig.app.json plus
    # the three standalone packages/* programs, all at zero errors.
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

  quality-gates:
    # The REQUIRED gate. Runs the release suite (full suite minus the
    # shrink-only exclusion list in tests/release-exclusions.txt) so the
    # required signal states only true things while the full-suite debt is
    # burned down. The full-suite job below keeps the debt visible; when the
    # exclusion list reaches zero this job becomes `npm run test` again.
    name: Unit tests (release gate)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Unit tests (release gate)
        run: npm run test:release

  full-suite:
    # Advisory while tests/release-exclusions.txt shrinks to zero: shows the
    # remaining debt on every PR without blocking merges on known-red files.
    name: Full suite (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Full suite
        run: npm run test

  gallery-smoke:
    # Assembles the deployable examples site and smoke-tests every shipped
    # page in a real browser: loads, key surface visible, clean console, no
    # tldraw license blank-out. Required: a broken gallery page blocks merge.
    name: Gallery smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Gallery import guard
        run: node scripts/check-gallery-imports.mjs

      - name: Build the examples site
        env:
          VITE_TLDRAW_LICENSE_KEY: ${{ secrets.TLDRAW_LICENSE_KEY }}
        run: npm run build:examples-site

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Smoke test the assembled site
        run: npm run test:smoke

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gallery-smoke-traces
          path: test-results/
          retention-days: 7

  bundle-budgets:
    # Builds the embed bundles and enforces the gzip budgets in
    # scripts/check-bundle-size.mjs. Required: a budget bust blocks merge.
    name: Bundle budgets
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build embeds and check budgets
        # REQUIRE_ALL turns a missing artifact into a failure, so the gate
        # cannot pass by a bundle silently not being built.
        env:
          CHECK_BUNDLE_REQUIRE_ALL: "1"
        run: npm run build:embed:site && npm run check:bundle
