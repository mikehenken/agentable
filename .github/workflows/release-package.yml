name: Release package

on:
  push:
    branches:
      - main
    paths:
      - package.json
  workflow_dispatch:
    inputs:
      version:
        description: "Semver version (e.g. 0.2.0) or bump keyword (patch|minor|major)"
        required: true
        type: string
      prerelease:
        description: "Mark GitHub release as prerelease"
        required: false
        type: boolean
        default: false
      release_notes:
        description: "Optional release notes (appended to generated notes)"
        required: false
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: release-package
  cancel-in-progress: false

jobs:
  release:
    name: Tag, publish, release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Auto-release only for human merges; manual dispatch may push a version commit.
    if: github.event_name == 'workflow_dispatch' || github.actor != 'github-actions[bot]'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          read_version() {
            node -e "const fs=require('fs');const p=process.argv[1];console.log(JSON.parse(fs.readFileSync(p,'utf8')).version)" "$1"
          }

          CURRENT=$(read_version package.json)
          EVENT="${{ github.event_name }}"
          TAG="v${CURRENT}"

          if [[ "$EVENT" == "workflow_dispatch" ]]; then
            INPUT="${{ inputs.version }}"

            resolve_bump() {
              local bump="$1"
              node -e "
                const [maj, min, pat] = process.argv[1].split('.').map(Number);
                const bump = process.argv[2];
                let next;
                if (bump === 'major') next = [maj + 1, 0, 0];
                else if (bump === 'minor') next = [maj, min + 1, 0];
                else if (bump === 'patch') next = [maj, min, pat + 1];
                else throw new Error('invalid bump');
                console.log(next.join('.'));
              " "$CURRENT" "$bump"
            }

            if [[ "$INPUT" =~ ^(patch|minor|major)$ ]]; then
              NEXT=$(resolve_bump "$INPUT")
            elif [[ "$INPUT" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
              NEXT="$INPUT"
            else
              echo "::error::version must be semver (e.g. 0.2.0) or patch|minor|major"
              exit 1
            fi

            TAG="v${NEXT}"
            echo "mode=manual" >> "$GITHUB_OUTPUT"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "next=$NEXT" >> "$GITHUB_OUTPUT"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          else
            PREVIOUS=""
            if git rev-parse HEAD^ >/dev/null 2>&1; then
              git show HEAD^:package.json > /tmp/previous-package.json
              PREVIOUS=$(read_version /tmp/previous-package.json)
            fi

            if [[ "$CURRENT" == "$PREVIOUS" ]]; then
              echo "package.json version unchanged (${CURRENT}) — skipping release"
              echo "mode=auto" >> "$GITHUB_OUTPUT"
              echo "should_release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "Detected version bump: ${PREVIOUS:-<none>} -> ${CURRENT}"
            echo "mode=auto" >> "$GITHUB_OUTPUT"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "next=$CURRENT" >> "$GITHUB_OUTPUT"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          fi

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Tag $TAG already exists — will skip tag push and retry publish/release."
          else
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip when no release needed
        if: steps.version.outputs.should_release != 'true'
        run: echo "No release required for this push."

      - name: Setup Node.js
        if: steps.version.outputs.should_release == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
          scope: "@mikehenken"

      - name: Install dependencies
        if: steps.version.outputs.should_release == 'true'
        run: npm install --no-audit --no-fund

      - name: Unit tests (release gate)
        if: steps.version.outputs.should_release == 'true'
        # tests/release-exclusions.txt is empty, so this runs the full suite
        # as a pre-publish gate (identical to `npm run test`).
        run: npm run test:release

      - name: Bump package.json version
        if: steps.version.outputs.should_release == 'true' && steps.version.outputs.mode == 'manual'
        shell: bash
        run: |
          set -euo pipefail
          CURRENT=$(node -p "require('./package.json').version")
          NEXT="${{ steps.version.outputs.next }}"
          if [[ "$CURRENT" == "$NEXT" ]]; then
            echo "package.json already at ${NEXT} — skipping npm version bump"
          else
            npm version "$NEXT" --no-git-tag-version
          fi

      - name: Commit version bump
        if: steps.version.outputs.should_release == 'true' && steps.version.outputs.mode == 'manual'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          if [ -f package-lock.json ]; then git add package-lock.json; fi
          if git diff --staged --quiet; then
            echo "No version file changes to commit"
          else
            git commit -m "[release] v${{ steps.version.outputs.next }}"
          fi

      - name: Create git tag
        if: steps.version.outputs.should_release == 'true' && steps.version.outputs.tag_exists != 'true'
        run: git tag "${{ steps.version.outputs.tag }}"

      - name: Push commit and tag
        if: steps.version.outputs.should_release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.version.outputs.mode }}" == "manual" ]]; then
            if git rev-parse --verify origin/main >/dev/null 2>&1; then
              LOCAL_HEAD=$(git rev-parse HEAD)
              REMOTE_HEAD=$(git rev-parse origin/main)
              if [[ "$LOCAL_HEAD" != "$REMOTE_HEAD" ]]; then
                git push origin main
              else
                echo "main unchanged — skipping push"
              fi
            fi
          fi
          if [[ "${{ steps.version.outputs.tag_exists }}" != "true" ]]; then
            git push origin "${{ steps.version.outputs.tag }}"
          else
            echo "Tag ${{ steps.version.outputs.tag }} already on remote — skipping tag push"
          fi

      - name: Create GitHub release
        if: steps.version.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub release $TAG already exists — skipping create"
            exit 0
          fi

          NOTES_FILE="$(mktemp)"
          {
            echo "## ${TAG}"
            echo ""
            echo "Published \`@mikehenken/agentable-canvas@${{ steps.version.outputs.next }}\` to npm."
            echo ""
            echo "### Consumer bump (landi-canvas-studio)"
            echo '```json'
            echo "\"@mikehenken/agentable-canvas\": \"github:mikehenken/agentable#${TAG}\""
            echo '```'
            if [[ -n "${{ inputs.release_notes }}" ]]; then
              echo ""
              echo "### Notes"
              echo "${{ inputs.release_notes }}"
            fi
          } > "$NOTES_FILE"

          ARGS=( "$TAG" --title "$TAG" --notes-file "$NOTES_FILE" )
          if [[ "${{ inputs.prerelease }}" == "true" ]]; then
            ARGS+=( --prerelease )
          fi
          gh release create "${ARGS[@]}"

      - name: Build publishable artifacts
        if: steps.version.outputs.should_release == 'true'
        run: npm run build:embed:all

      - name: Publish to npm
        if: steps.version.outputs.should_release == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          # Scoped public package @mikehenken/agentable-canvas on registry.npmjs.org.
          # Requires the NPM_TOKEN repo secret (automation token owning the @mikehenken scope).
          # No failure swallow: a publish failure fails the job so it is never silently green.
          npm publish --access public
