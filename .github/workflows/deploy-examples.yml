name: Deploy examples

# Publishes the examples gallery to Cloudflare Pages.
#
# Runs on every push to main and after the release workflow tags a version, so
# the hosted gallery always matches the released bundles. The build is ordered:
# vite.embed.config.ts sets emptyOutDir and therefore must run first, otherwise
# it wipes the sibling bundles that the examples load.
on:
  push:
    branches:
      - main
  workflow_run:
    workflows: ['Release package']
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-examples
  cancel-in-progress: true

jobs:
  deploy:
    # For workflow_run, only publish when the release actually succeeded.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build embed bundles and assemble the gallery
        run: npm run build:examples-site

      - name: Verify the assembled site
        # Fail before publishing if the artifact is missing its entry points.
        run: |
          test -f dist/site/index.html
          test -d dist/site/examples
          test -f dist/site/embed/agentable-canvas.js
          test -f dist/site/embed/agentable-panel.js
          test -f dist/site/embed/agentable-whiteboard.js
          echo "examples: $(find dist/site/examples -mindepth 1 -maxdepth 1 -type d | wc -l)"

      - name: Check Cloudflare credentials
        id: creds
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set; skipping publish. The gallery built successfully and is available as an artifact."
          fi

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: examples-site
          path: dist/site
          retention-days: 14

      - name: Ensure the Pages project exists
        if: steps.creds.outputs.configured == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'agentable-examples' }}
        # `pages deploy` fails with "Project not found" rather than creating the
        # project, so a first-time deploy needs it to exist up front.
        run: |
          set -euo pipefail
          if npx --yes wrangler@3 pages project list 2>/dev/null | grep -qE "(^|[[:space:]])${PROJECT}([[:space:]]|$)"; then
            echo "Pages project ${PROJECT} already exists"
          else
            echo "creating Pages project ${PROJECT}"
            npx --yes wrangler@3 pages project create "${PROJECT}" --production-branch=main
          fi

      - name: Publish to Cloudflare Pages
        if: steps.creds.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy dist/site
            --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT || 'agentable-examples' }}
            --branch=main
