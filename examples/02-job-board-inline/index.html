<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>02 — Job board inline · Archipelago Resorts</title>
    <style>
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
        color: #0f172a;
        background: #f8fafc;
      }.page {
        max-width: 960px;
        margin: 0 auto;
        padding: 2rem 1.25rem 3rem;
      }
      h1 {
        margin: 0 0 0.5rem;
      }.lede {
        color: #475569;
        margin: 0 0 2rem;
      }.panel-region {
        min-height: 480px;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        overflow: hidden;
        background: #fff;
      }
      agentable-panel {
        display: block;
        min-height: 480px;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <h1>Open island roles</h1>
      <p class="lede">
        A single <code>&lt;agentable-panel&gt;</code> mid-page lists Archipelago Resorts positions with
        filters — the helios job-board shape on a mock static adapter.
      </p>
      <div class="panel-region">
        <agentable-panel
          panel="open-positions"
          config-url="/examples/shared/archipelago-panel-config.json"
          primary-color="#0E7490"
        ></agentable-panel>
      </div>
    </div>
    <script type="module" src="/embed/agentable-panel.js"></script>
    <script type="module">
      window.__galleryExample = '02-job-board-inline';
      customElements.whenDefined('agentable-panel').then(() => {
        window.__galleryReady = { example: '02-job-board-inline', ok: true };
      });
    </script>
  </body>
</html>
