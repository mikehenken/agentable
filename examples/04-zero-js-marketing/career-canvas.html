<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>Career Canvas · Archipelago Resorts</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/embed/career-whiteboard.css" />
    <style>
      /* Dedicated career-canvas route: the canvas IS the page, so it takes the
         whole viewport rather than sitting in a marketing section. No page
         chrome competes with it and nothing scrolls behind it. */
      :root {
        color-scheme: light;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        background: #f4f6f8;
        font-family: 'Inter', system-ui, sans-serif;
        color: #16283c;
      }
      .canvas-topbar {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding: 0.75rem clamp(1rem, 3vw, 2rem);
        background: #ffffff;
        border-bottom: 1px solid rgb(14 116 144 / 0.14);
      }
      .brand {
        display: inline-flex;
        align-items: center;
        gap: 0.6rem;
        font-weight: 600;
        text-decoration: none;
        color: inherit;
      }
      .brand-mark {
        display: grid;
        place-items: center;
        width: 2rem;
        height: 2rem;
        border-radius: 0.5rem;
        background: #0e7490;
        color: #ffffff;
        font-weight: 700;
      }
      .brand-text {
        font-family: 'Playfair Display', Georgia, serif;
        font-size: 1.05rem;
      }
      .back-link {
        font-size: 0.85rem;
        text-decoration: none;
        color: #0e7490;
        border: 1px solid rgb(14 116 144 / 0.3);
        border-radius: 999px;
        padding: 0.4rem 0.9rem;
      }
      .back-link:hover {
        background: rgb(14 116 144 / 0.08);
      }
      /* The canvas fills every pixel the topbar does not use. */
      .canvas-stage {
        flex: 1 1 auto;
        min-height: 0;
        display: flex;
      }
      .canvas-stage agentable-whiteboard {
        display: block;
        flex: 1 1 auto;
        width: 100%;
        height: 100%;
        min-height: 0;
      }
    </style>
  </head>
  <body>
    <header class="canvas-topbar">
      <a class="brand" href="./index.html">
        <span class="brand-mark" aria-hidden="true">A</span>
        <span class="brand-text">Archipelago Resorts</span>
      </a>
      <a class="back-link" href="./index.html">Back to careers site</a>
    </header>

    <main class="canvas-stage">
      <agentable-whiteboard
        tenant="archipelago-resorts"
        config-url="/examples/shared/archipelago-career-whiteboard-config.json"
        canvas-mode="free"
        light-canvas
        mock-chat
        voice-enabled
        snap-grid
      ></agentable-whiteboard>
    </main>

    <script type="module" src="/embed/career-whiteboard.js"></script>
    <script type="module">
      window.__galleryExample = '04-zero-js-marketing/career-canvas';
      customElements.whenDefined('agentable-whiteboard').then(() => {
        const board = document.querySelector('agentable-whiteboard');
        window.__galleryReady = {
          example: '04-zero-js-marketing/career-canvas',
          ok: Boolean(board),
          route: 'career-canvas',
        };
      });
    </script>
  </body>
</html>
