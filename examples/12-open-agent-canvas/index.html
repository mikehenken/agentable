<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meridian Labs · Open agent canvas</title>
    <link rel="stylesheet" href="/embed/agentable-whiteboard.css" />
    <style>:root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        display: flex;
        flex-direction: column;
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        background: #0f172a;
        color: #e2e8f0;
      }
      header {
        display: flex;
        flex: 0 0 auto;
        align-items: center;
        justify-content: space-between;
        gap: 1.5rem;
        padding: 0.9rem 1.5rem;
        border-bottom: 1px solid rgba(148, 163, 184, 0.16);
        background: linear-gradient(180deg, #1e1b4b 0%, #0f172a 100%);
      }.brand {
        display: flex;
        align-items: center;
        gap: 0.7rem;
        min-width: 0;
      }.brand-mark {
        display: grid;
        flex-shrink: 0;
        place-items: center;
        width: 30px;
        height: 30px;
        border-radius: 8px;
        background: linear-gradient(135deg, #4338ca 0%, #6366f1 100%);
        color: #fff;
        font-size: 13px;
        font-weight: 700;
      }.brand-text h1 {
        margin: 0;
        font-size: 0.95rem;
        font-weight: 600;
        letter-spacing: 0.02em;
        color: #f8fafc;
      }.brand-text p {
        margin: 2px 0 0;
        font-size: 0.78rem;
        color: #94a3b8;
      }.tagline {
        max-width: 440px;
        margin: 0;
        font-size: 0.82rem;
        line-height: 1.45;
        color: #94a3b8;
        text-align: right;
      }
      main {
        position: relative;
        flex: 1;
        min-height: 0;
      }
      agentable-whiteboard {
        display: block;
        width: 100%;
        height: 100%;
        min-height: 480px;
      }
      @media (max-width: 720px) {.tagline {
          display: none;
        }
        agentable-whiteboard {
          min-height: 45dvh;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">ML</div>
        <div class="brand-text">
          <h1>Meridian Labs · open agent canvas</h1>
          <p>Atlas product design copilot · canvasPolicy: open</p>
        </div>
      </div>
      <p class="tagline">
        Connected onboarding wireframe and structured brief — host-data save stays HITL even under open policy.
      </p>
    </header>
    <main>
      <agentable-whiteboard
        tenant="meridian-labs"
        config-url="/examples/shared/meridian-labs-open-config.json"
        dark-canvas
      ></agentable-whiteboard>
    </main>

    <script type="module" src="/embed/agentable-whiteboard.js"></script>
    <script type="module" src="./gallery-demo.mjs"></script>
  </body>
</html>
