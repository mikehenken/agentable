<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>P8 — Agent draw &amp; see · Northstar Atelier</title>
    <link rel="stylesheet" href="/embed/agentable-whiteboard.css" />
    <style>:root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        height: 100%;
      }
      body {
        display: flex;
        flex-direction: column;
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        background: #0b1220;
        color: #e7ecf3;
      }
      header {
        display: flex;
        flex: 0 0 auto;
        align-items: center;
        justify-content: space-between;
        gap: 1.5rem;
        padding: 0.85rem 1.25rem;
        border-bottom: 1px solid rgba(148, 163, 184, 0.16);
        background: linear-gradient(180deg, #111827 0%, #0b1220 100%);
      }.brand {
        display: flex;
        align-items: center;
        gap: 0.7rem;
        min-width: 0;
      }.brand-mark {
        display: grid;
        flex-shrink: 0;
        place-items: center;
        width: 30px;
        height: 30px;
        border-radius: 8px;
        background: linear-gradient(135deg, #5b21b6 0%, #7c3aed 100%);
        color: #fff;
        font-size: 13px;
        font-weight: 700;
      }.brand-text h1 {
        margin: 0;
        font-size: 0.92rem;
        font-weight: 600;
        letter-spacing: 0.03em;
        text-transform: uppercase;
        color: #f4f7fb;
      }.brand-text p {
        margin: 1px 0 0;
        font-size: 0.78rem;
        color: #93a3be;
      }.tagline {
        max-width: 420px;
        margin: 0;
        font-size: 0.82rem;
        line-height: 1.45;
        color: #93a3be;
        text-align: right;
      }.app {
        display: flex;
        flex: 1;
        min-height: 0;
        min-width: 0;
      }
      aside {
        flex: 0 0 340px;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        padding: 1.1rem 1.25rem;
        border-right: 1px solid rgba(148, 163, 184, 0.14);
        background: #0f172a;
        overflow: auto;
        min-height: 0;
      }
      aside h2 {
        margin: 0;
        font-size: 1.05rem;
        font-weight: 600;
      }
      aside.subtitle {
        margin: 0.25rem 0 0;
        font-size: 0.82rem;
        color: #94a3b8;
        line-height: 1.45;
      }.controls {
        display: flex;
        flex-direction: column;
        gap: 0.45rem;
      }.controls button {
        padding: 0.55rem 0.75rem;
        border-radius: 8px;
        border: 1px solid #475569;
        background: transparent;
        color: #f8fafc;
        cursor: pointer;
        font-size: 0.85rem;
        text-align: left;
      }.controls button:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }.controls button.primary {
        border: none;
        background: #7c3aed;
      }.provenance {
        margin: 0;
        font-size: 0.8rem;
        line-height: 1.5;
      }.provenance dt {
        color: #94a3b8;
      }.provenance dd {
        margin: 0 0 0.5rem;
      }.log-heading {
        margin: 0.5rem 0 0.35rem;
        font-size: 0.72rem;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: #64748b;
      }
      #p8-activity-log {
        margin: 0;
        padding-left: 1.1rem;
        font-size: 0.78rem;
        color: #cbd5e1;
        flex: 1;
        min-height: 120px;
      }
      #p8-activity-log li {
        margin-bottom: 0.35rem;
      }
      main {
        position: relative;
        flex: 1;
        min-width: 0;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }
      agentable-whiteboard {
        display: block;
        width: 100%;
        height: 100%;
        flex: 1;
        min-height: 480px;
      }
      @media (max-width: 720px) {.tagline {
          display: none;
        }.app {
          flex-direction: column;
        }
        aside {
          flex: 0 0 auto;
          max-height: 42dvh;
          border-right: none;
          border-bottom: 1px solid rgba(148, 163, 184, 0.14);
        }
        main {
          flex: 1;
          min-height: 45dvh;
        }
        agentable-whiteboard {
          min-height: 320px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">NA</div>
        <div class="brand-text">
          <h1>Northstar Atelier</h1>
          <p>Creative studio · agent draw &amp; see</p>
        </div>
      </div>
      <p class="tagline">
        Scripted agent tools draw a workflow diagram and provenance marks — no API keys required.
      </p>
    </header>

    <div class="app">
      <aside>
        <div>
          <h2>Northstar Atelier</h2>
          <p class="subtitle">
            P8 try-it: agent <strong>draw</strong> + <strong>see</strong> (scripted tools, no API keys)
          </p>
        </div>

        <div class="controls">
          <button type="button" class="primary" data-testid="p8-run-full-demo">Run full demo</button>
          <button type="button" data-testid="p8-draw-flow">Draw flow diagram</button>
          <button type="button" data-testid="p8-draw-batch">Draw shape batch</button>
          <button type="button" data-testid="p8-read-canvas">Read canvas (see)</button>
          <button type="button" data-testid="p8-clear">Clear agent drawings</button>
        </div>

        <dl class="provenance" data-testid="p8-provenance-summary" hidden>
          <dt>Agent-stamped shapes</dt>
          <dd data-field="stamped">—</dd>
          <dt>Provenance agent ids</dt>
          <dd data-field="agents">—</dd>
        </dl>

        <p class="log-heading">Activity log</p>
        <ol id="p8-activity-log" data-testid="p8-activity-log"></ol>
      </aside>

      <main>
        <agentable-whiteboard tenant="northstar-atelier" dark-canvas></agentable-whiteboard>
      </main>
    </div>

    <script type="module">
      const CONFIG_CANDIDATES = ['./config.local.json', './config.example.json'];
      const whiteboardEl = document.querySelector('agentable-whiteboard');

      async function resolveConfigUrl() {
        for (const url of CONFIG_CANDIDATES) {
          try {
            const response = await fetch(url);
            // SPA-fallback hosts answer 200 text/html for missing files;
            // require a JSON content type so an absent config.local.json
            // falls through to the committed example config.
            const contentType = response.headers.get('content-type') || '';
            if (response.ok && contentType.includes('json')) return url;
          } catch {
            // try next candidate
          }
        }
        return CONFIG_CANDIDATES[CONFIG_CANDIDATES.length - 1];
      }

      window.__galleryExample = 'p8-agent-draw-demo';
      const resolvedConfigUrl = await resolveConfigUrl();
      whiteboardEl.setAttribute('config-url', resolvedConfigUrl);
    </script>
    <script type="module" src="/embed/agentable-whiteboard.js"></script>
    <script type="module" src="./gallery-demo.mjs"></script>
  </body>
</html>
