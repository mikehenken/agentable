<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>11 · App shell (DOM engine) · Archipelago Resorts</title>
    <link rel="stylesheet" href="/embed/agentable-whiteboard.css" />
    <style>:root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        display: flex;
        flex-direction: column;
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        background: #0f172a;
        color: #e2e8f0;
      }
      header {
        display: flex;
        flex: 0 0 auto;
        align-items: center;
        justify-content: space-between;
        gap: 1.5rem;
        padding: 0.9rem 1.5rem;
        border-bottom: 1px solid rgba(148, 163, 184, 0.16);
        background: linear-gradient(180deg, #134e4a 0%, #0f172a 100%);
      }.brand {
        display: flex;
        align-items: center;
        gap: 0.7rem;
        min-width: 0;
      }.brand-mark {
        display: grid;
        flex-shrink: 0;
        place-items: center;
        width: 30px;
        height: 30px;
        border-radius: 8px;
        background: linear-gradient(135deg, #0e7490 0%, #14b8a6 100%);
        color: #fff;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }.brand-text h1 {
        margin: 0;
        font-size: 0.95rem;
        font-weight: 600;
        letter-spacing: 0.02em;
        color: #f8fafc;
      }.brand-text p {
        margin: 2px 0 0;
        font-size: 0.78rem;
        color: #94a3b8;
      }.tagline {
        max-width: 440px;
        margin: 0;
        font-size: 0.82rem;
        line-height: 1.45;
        color: #94a3b8;
        text-align: right;
      }
      main {
        position: relative;
        flex: 1;
        min-height: 0;
      }
      agentable-app-shell {
        display: block;
        width: 100%;
        height: 100%;
        min-height: 480px;
      }
      details.gallery-telemetry {
        position: absolute;
        right: 12px;
        bottom: 12px;
        z-index: 2;
        max-width: min(420px, calc(100vw - 24px));
        border-radius: 8px;
        border: 1px solid rgba(148, 163, 184, 0.2);
        background: rgba(15, 23, 42, 0.92);
        font-size: 0.72rem;
        color: #94a3b8;
      }
      details.gallery-telemetry summary {
        cursor: pointer;
        padding: 0.35rem 0.65rem;
        user-select: none;
      }
      details.gallery-telemetry pre#status {
        margin: 0;
        padding: 0.5rem 0.65rem 0.65rem;
        max-height: 7rem;
        overflow: auto;
        color: #cbd5e1;
        font-size: 0.68rem;
        border-top: 1px solid rgba(148, 163, 184, 0.12);
      }
      @media (max-width: 720px) {.tagline {
          display: none;
        }
        agentable-app-shell {
          min-height: 45dvh;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">AR</div>
        <div class="brand-text">
          <h1>Archipelago Resorts</h1>
          <p>Island careers workspace · DOM engine</p>
        </div>
      </div>
      <p class="tagline">
        Resizable main/sidebar split with per-region tabs — same career panels as the canvas gallery, no drawing surface.
      </p>
    </header>
    <main>
      <agentable-app-shell
        id="app-shell"
        tenant="archipelago-resorts"
        primary-color="#0E7490"
        career-data-url="/examples/shared/archipelago-career-data.json"
        locale="en"
      ></agentable-app-shell>
      <details class="gallery-telemetry">
        <summary>Telemetry</summary>
        <pre id="status">waiting for workspace…</pre>
      </details>
    </main>
    <script type="module" src="/embed/agentable-app-shell.js"></script>
    <script type="module">
      window.__galleryExample = '11-app-shell';
      const status = document.getElementById('status');
      const shell = document.getElementById('app-shell');

      shell.addEventListener('agentable:workspace-ready', (event) => {
        status.textContent = JSON.stringify(event.detail, null, 2);
        window.__appShellReadyDetail = event.detail;
        window.__galleryReady = { example: '11-app-shell', ok: true,...event.detail };
      });
    </script>
  </body>
</html>
